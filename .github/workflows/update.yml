# 한 시간마다 시세 자료를 새로 받아 data/ 에 올린다 (노트북이 꺼져 있어도 GitHub 서버에서 돈다)
name: 자료 갱신

on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분 (세계 표준시 기준이지만 한 시간마다라 상관없음)
  workflow_dispatch:       # Actions 화면에서 [Run workflow]로 바로 돌릴 수도 있음

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 자료 받기
        run: node scripts/update.js ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: 바뀐 자료 올리기
        run: |
          git config user.name "asset-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 자료 없음"
          else
            git commit -m "자료 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
