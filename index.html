<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자산 모니터 · 자산 온도</title>
<meta name="description" content="VOO·SCHD·QQQ·금·비트코인·코스피·서울 아파트의 역사적 수익률, 최대 낙폭, 지금 하락 위치와 상대적인 자산 온도">
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f3; --panel:#fcfcfb; --ink:#0b0b0b; --sub:#52514e; --muted:#7d7b75;
  --line:#e1e0d9; --line2:#efeee9; --axis:#c3c2b7; --grid:#ecebe5; --track:#e9e8e2;
  --brand:#17365E; --brand-w:#e8edf4; --accent:#e07a4f;
  --price:#17365E;
  --up:#e34948; --dn:#2a78d6; --up-t:#c42f2f; --dn-t:#1c5cab; --dn-w:rgba(42,120,214,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --panel:#1a1a19; --ink:#f0efec; --sub:#c3c2b7; --muted:#9a988f;
    --line:#2c2c2a; --line2:#242423; --axis:#45443f; --grid:#262624; --track:#2a2a28;
    --brand:#8ab8f5; --brand-w:#1c2738; --accent:#ee9a74;
    --price:#9ec5f4;
    --up:#e66767; --dn:#3987e5; --up-t:#f28b8b; --dn-t:#7fb1ee; --dn-w:rgba(57,135,229,.24);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --panel:#1a1a19; --ink:#f0efec; --sub:#c3c2b7; --muted:#9a988f;
  --line:#2c2c2a; --line2:#242423; --axis:#45443f; --grid:#262624; --track:#2a2a28;
  --brand:#8ab8f5; --brand-w:#1c2738; --accent:#ee9a74;
  --price:#9ec5f4;
  --up:#e66767; --dn:#3987e5; --up-t:#f28b8b; --dn-t:#7fb1ee; --dn-w:rgba(57,135,229,.24);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
#status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
#status.ok .dot{background:#0ca30c}
#status.bad .dot{background:#d03b3b}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--sub);cursor:pointer;font-size:14.5px}
.tabs button:hover{background:var(--line2)}
.tabs button.on{background:var(--brand-w);color:var(--ink);font-weight:700}
.pane{display:none}
.pane.on{display:block}
.pane>.panel:first-child,.pane>.cards:first-child{margin-top:0}
.con-box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
.con-box h3{margin:0 0 8px;font-size:15px}
.notice{border-left:4px solid var(--accent);background:var(--line2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;font-size:14px;line-height:1.65;color:var(--sub)}
.notice b{color:var(--ink)}
.holds{display:flex;flex-wrap:wrap;gap:8px 18px;margin:4px 0 10px}
.holds label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.holds label span{font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--panel);font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.ghost:hover{background:var(--line2)}
main{max-width:1320px;margin:0 auto;padding:16px 20px 40px}
.muted{color:var(--muted)}
.up{color:var(--up-t)} .dn{color:var(--dn-t)}
.num{font-variant-numeric:tabular-nums}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--axis)}
.card.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.c-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.c-name{font-weight:700;font-size:16px;white-space:nowrap}
.c-desc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-state{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.c-state.live{color:#0a8a0a}
.c-state.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#0ca30c;margin-right:5px;vertical-align:1px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.c-price{font-size:24px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.c-price small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.c-chg{font-size:13px}
.c-row{display:flex;gap:14px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.c-row b{font-weight:700;color:var(--ink)}
.gauge{margin-top:4px}
.g-label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px}
.g-label b{color:var(--ink)}
.track{position:relative;height:8px;border-radius:4px;background:var(--track)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--dn);min-width:3px}

/* 자세히 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
.d-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.d-head h2{margin:0;font-size:22px}
.d-head h2 span{font-size:14px;font-weight:400;color:var(--muted);margin-left:8px}
.d-price{font-size:15px;margin-top:2px}
.d-price b{font-size:26px;margin-right:8px}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--sub)}
.kpi .v{font-size:22px;font-weight:700;line-height:1.3;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--muted);line-height:1.35}
.where{margin-top:16px;border-radius:10px;background:var(--line2);padding:14px 16px}
.where h3{margin:0 0 10px;font-size:15px}
.big-g{position:relative;margin:26px 4px 22px}
.big-g .track{height:14px;border-radius:7px}
.big-g .fill{border-radius:7px}
.big-g .ep{position:absolute;top:-3px;width:2px;height:20px;background:var(--sub);opacity:.45;transform:translateX(-1px);cursor:default}
.big-g .ep:hover{opacity:1}
.big-g .now{position:absolute;top:-24px;transform:translateX(-50%);font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--dn-t)}
.big-g .now::after{content:"";position:absolute;left:50%;top:19px;width:2px;height:24px;background:var(--ink);transform:translateX(-1px)}
.big-g .sc{position:absolute;top:18px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.where ul{margin:0;padding-left:18px;font-size:14px;color:var(--sub)}
.where li{margin:3px 0}
.where li b{color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
.chip:hover{background:var(--line2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--panel);font-weight:700}
.toolbar label{margin-left:auto;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;cursor:pointer}
.ch-title{font-size:13px;color:var(--sub);margin:12px 0 2px;font-weight:700}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
svg text{fill:var(--muted);font-size:11px}
svg .lbl{fill:var(--ink);font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .base{stroke:var(--axis);stroke-width:1}
svg .xh{stroke:var(--sub);stroke-width:1;opacity:.6}
h3.sec{font-size:15px;margin:22px 0 6px}
.note{font-size:12.5px;color:var(--muted);margin:4px 0 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{font-weight:700;color:var(--sub);font-size:12.5px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.tbl-wrap{overflow-x:auto}
#aptTable th{cursor:pointer;user-select:none}
#aptTable th:hover{color:var(--ink)}
#aptTable th.sorted::after{content:" ▾";font-size:10px}
#aptTable th.sorted.asc::after{content:" ▴"}
#aptTable tbody tr{cursor:pointer}
#aptTable tbody tr:hover td{background:var(--line2)}
#aptTable tr.on td{background:var(--brand-w)}
#aptTable tr.seoul td{font-weight:700}
.mini{display:inline-block;vertical-align:middle;width:70px;height:6px;border-radius:3px;background:var(--track);position:relative;margin-left:8px}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--dn);min-width:2px}
/* 구별 전고점 */
.pk-sum{font-size:14px;color:var(--sub);margin:4px 0 10px}
.pk-sum b{color:var(--ink)}
.pk-axis,.pk-row{display:grid;grid-template-columns:76px minmax(0,1fr) 330px;gap:12px;align-items:center}
.pk-axis{font-size:11px;color:var(--muted);margin-bottom:2px}
.pk-axis .pk-bar{height:16px;background:none}
.pk-axis .pk-bar span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.pk-row{padding:5px 0;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13.5px}
.pk-row:hover{background:var(--line2)}
.pk-row.on{background:var(--brand-w)}
.pk-row.seoul{font-weight:700}
.pk-bar{position:relative;height:18px}
.pk-bar .z{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink);opacity:.55}
.pk-bar .g{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.pk-bar .drop{position:absolute;top:5px;height:8px;background:var(--dn-w);border-radius:4px 0 0 4px}
.pk-bar .rise{position:absolute;top:5px;height:8px;background:var(--up);border-radius:0 4px 4px 0;opacity:.85}
.pk-bar .low{position:absolute;top:3px;height:12px;width:2px;background:var(--dn);transform:translateX(-1px)}
.pk-bar .cur{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;transform:translateX(-6px);border:2px solid var(--panel)}
.pk-txt{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 8px;font-size:13px;color:var(--sub)}
.lv-top select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel);font-size:13px}
.lv-name small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.2}
.pk-bar .band{position:absolute;top:5px;height:8px;background:var(--track);border-radius:4px}
.pk-bar .tk{position:absolute;top:3px;height:12px;width:2px;background:var(--muted);transform:translateX(-1px)}
.pk-bar .mean{position:absolute;top:0;height:18px;width:2px;background:var(--accent);transform:translateX(-1px)}
.tr{font-weight:700;white-space:nowrap}
.tr-up{color:var(--up-t)} .tr-dn{color:var(--dn-t)} .tr-flat{color:var(--sub)}
.tr small{font-weight:400;color:var(--muted);margin-left:4px}
.tbar{display:inline-block;position:relative;width:110px;height:8px;background:var(--track);border-radius:4px;vertical-align:middle;margin-right:8px}
.tbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink);opacity:.45}
.tbar i{position:absolute;top:0;bottom:0;border-radius:4px}
#tempTable tbody tr,#relTable tbody tr{cursor:pointer}
#tempTable tbody tr:hover td,#relTable tbody tr:hover td{background:var(--line2)}
#tempTable tr.on td,#relTable tr.on td{background:var(--brand-w)}
td small{font-size:11.5px}
/* 큰 표는 칸 안에서 줄을 바꿔 화면 폭에 맞춘다 (옆으로 밀리는 막대가 생기지 않게) */
#tempTable th,#tempTable td,#relTable th,#relTable td,#aptTable th{white-space:normal}
#tempTable td small,#relTable td small{display:block}
#tempTable td:last-child,#relTable td:last-child{white-space:nowrap;text-align:left;width:1%}
.tcell{display:grid;grid-template-columns:76px 80px;column-gap:8px;align-items:center}
.tcell .tbar{margin:0;width:76px}
.tcell b{font-size:14px}
.tcell small{grid-column:1 / 3;display:block;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:2px}
ul.why{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--sub)}
ul.why li{margin:5px 0}
ul.why b{color:var(--ink)}
.cm-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px;margin-top:10px}
.cm{border-collapse:separate;border-spacing:2px;width:auto;font-size:12.5px}
.cm th{font-weight:400;color:var(--sub);padding:2px 6px;border:0;font-size:12px;text-align:right;white-space:nowrap}
.cm thead th{text-align:center;padding:2px 0}
.cm td{min-width:44px;height:32px;text-align:center;border:0;padding:0 2px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.cm td.blank{background:none;cursor:default}
.cm td.on{outline:2px solid var(--ink);outline-offset:-1px}
.cm-title{font-weight:700;font-size:13.5px;margin-bottom:2px}
.typ{position:absolute;left:0;top:0;bottom:0;background:rgba(224,122,79,.22);border-radius:7px 0 0 7px}
.typ-tk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);transform:translateX(-1px)}
.pk-txt b{color:var(--ink);font-size:13.5px}
@media (max-width:760px){
  .pk-axis,.pk-row{grid-template-columns:62px minmax(0,1fr)}
  .pk-txt{grid-column:2;white-space:normal}
  .pk-axis>span:last-child{display:none}
}
footer{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.7}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap}
.tip b{font-size:13.5px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.err{color:#d03b3b;font-size:13px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){
  main{padding:12px 16px 30px} header{padding:10px 16px;position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:19px}
}
</style>
</head>
<body>
<header>
  <div class="brand">자산 모니터<small>역사적 수익률 · 최대 낙폭 · 지금 하락 위치</small></div>
  <nav class="tabs" id="tabs"><button data-tab="sum">전체 요약</button><button data-tab="fin">금융 투자</button><button data-tab="apt">부동산</button><button data-tab="con">결론</button></nav>
  <div class="right">
    <span class="seg" id="basis" title="달러 자산(VOO·SCHD·QQQ·GLD·비트코인)을 무엇으로 계산할지"><button data-krw="0">달러 기준</button><button data-krw="1">원화 기준</button></span>
    <span id="fx"></span>
    <span id="status"><span class="dot"></span>불러오는 중</span>
    <button class="ghost" id="reload" title="일별 기록과 아파트 자료를 처음부터 다시 받아요">기록 다시 받기</button>
  </div>
</header>
<main>
  <div class="pane" data-pane="sum">
    <section class="cards" id="cards"><div class="loading">시세 기록을 받는 중이에요…</div></section>
    <section class="panel" id="temp"></section>
    <section class="panel" id="sumApt"></section>
  </div>
  <div class="pane" data-pane="fin">
    <section class="cards" id="cardsFin"></section>
    <div id="hostFin"></div>
    <section class="panel" id="corr"></section>
  </div>
  <div class="pane" data-pane="con">
    <section class="panel" id="con"></section>
  </div>
  <section class="panel" id="detail" hidden></section>
  <div class="pane" data-pane="apt">
  <div id="hostApt"></div>
  <section class="panel" id="apt">
    <div class="d-head"><h2>서울 아파트 구별<span id="aptSub">KB부동산 매매가격지수 · ㎡당 평균 매매가</span></h2></div>
    <p class="note" id="aptNote">불러오는 중…</p>
    <div class="tbl-wrap"><table id="aptTable"></table></div>
    <h3 class="sec" style="margin-top:28px">구별 상대 가격 평가</h3>
    <div id="rel"><p class="note">불러오는 중…</p></div>
    <h3 class="sec" style="margin-top:28px">구별 전고점 대비 지금 위치</h3>
    <div id="peaks"><p class="note">불러오는 중…</p></div>
    <h3 class="sec" style="margin-top:28px">구별 가격 수준 (강남구 대비)</h3>
    <div id="lv"><p class="note">불러오는 중…</p></div>
  </section>
  </div>
  <footer id="foot"></footer>
</main>
<div class="tip" id="tip" hidden></div>
<script>window.ASSET_PUBLIC = true;</script>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const DAY = 864e5;
// 공개판: 서버 없이 data/*.json 을 읽고(한 시간마다 클라우드에서 갱신), '내 자산 리밸런싱' 칸은 뺀다
const PUBLIC = !!window.ASSET_PUBLIC;
const MAX_YEARS = 20; // 주식·금·비트코인·환율은 최근 20년까지만 (닷컴 버블 같은 옛 구간은 빼고)
const S = { assets: [], apt: null, aptRows: [], live: null, liveErr: false, sel: 'VOO', period: '20y', log: true, krw: false, sort: { key: 'cur', dir: 1 } };
S.lvBase = null; S.lvSel = null; // 구별 가격 수준: 기준 구(없으면 가장 비싼 구), 흐름을 볼 구
// 화면 탭: sum 전체 요약 · fin 금융 투자 · apt 부동산 · con 결론. 자세히는 금융(selFin)·부동산(selApt) 탭에 따로 기억
S.tab = 'sum'; S.selFin = 'VOO'; S.selApt = 'APT1100000000'; S.mvFrom = '1162000000'; S.mvTo = '1168000000'; S.mvDir = 'up'; // 갈아타기: up 상급지로, down 하급지로 S.hold = []; // 결론 탭에서 고른 '내 자산'

// ── 계산 ─────────────────────────────────────
function idxBefore(d, day) { let lo = 0, hi = d.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (d[m] < day) { r = m; lo = m + 1; } else hi = m - 1; } return r; }

function calc(s) {

const SEOUL = '1100000000';

    const area = line + `L${X(s.d[i1]).toFixed(1)} ${Y(0)}L${X(s.d[i0]).toFixed(1)} ${Y(0)}Z`;
    let mi = i0; for (let i = i0; i <= i1; i++) if (c.dd[i] < c.dd[mi]) mi = i;
    const mx = X(s.d[mi]), anchor = mx > W - R - 120 ? 'end' : mx < L + 100 ? 'start' : 'middle';
    elD.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" height="${Hh}" role="img" aria-label="${s.name} 고점 대비 하락률">
      ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${t === 0 ? '0%' : pct(t, 0)}</text>`).join('')}
      ${xTicks(D0, D1, W - L - R).map(([day, t]) => `<text x="${X(day)}" y="${Hh - 6}" text-anchor="middle">${t}</text>`).join('')}
      <path d="${area}" fill="var(--dn-w)"/>
      <path d="${line}" fill="none" stroke="var(--dn)" stroke-width="1.5" stroke-linejoin="round"/>
      <line class="base" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>
      ${c.dd[mi] < -0.01 ? `<text class="lbl" x="${mx}" y="${Math.min(Hh - B - 4, Y(c.dd[mi]) + 15)}" text-anchor="${anchor}">${pct(c.dd[mi])} (${dstr(s.d[mi], true)})</text>` : ''}
      <circle cx="${X(D1)}" cy="${Y(c.cur)}" r="4" fill="var(--dn)" stroke="var(--panel)" stroke-width="2"/>
      <text class="lbl" x="${X(D1) + 8}" y="${Y(c.cur) + 4}">${pct(c.cur)}</text>
      <line class="xh" id="xhD" y1="${T}" y2="${Hh - B}" hidden/><circle id="dotD" r="4" fill="var(--dn)" stroke="var(--panel)" stroke-width="2" hidden/>
      <rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${Hh}" fill="transparent"/></svg>`;
    H.dd = { Y };
  }
  H.s = s; H.c = c; H.X = X; H.D0 = D0; H.D1 = D1; H.L = L; H.R = R; H.W = W; H.i0 = i0;
  for (const el of [elP, elD]) {
    const svg = el.querySelector('svg'), hit = svg.querySelector('.hit');
    hit.addEventListener('mousemove', (e) => hover(e, svg));
    hit.addEventListener('mouseleave', unhover);
  }
  drawYears(elY, s, c, W);
}
function hover(e, svg) {
  const r = svg.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * H.W;
  const day = H.D0 + ((x - H.L) / (H.W - H.L - H.R)) * (H.D1 - H.D0);
  const s = H.s, c = H.c;
  let i = idxBefore(s.d, day + 0.5);
  if (i < H.i0) i = H.i0;
  if (i + 1 < s.d.length && Math.abs(s.d[i + 1] - day) < Math.abs(s.d[i] - day)) i++;
  const px = H.X(s.d[i]);
  const set = (id, attrs) => { const el = document.getElementById(id); if (!el) return; el.removeAttribute('hidden'); for (const k in attrs) el.setAttribute(k, attrs[k]); };
  set('xhP', { x1: px, x2: px }); set('xhD', { x1: px, x2: px });
  set('dotP', { cx: px, cy: H.price.Y(s.v[i]) }); set('dotD', { cx: px, cy: H.dd.Y(c.dd[i]) });
  const mo = s.kind === 'm';
  showTip(e, `<b>${dstr(s.d[i], mo)}</b><br>${mo ? '지수 ' + nf(s.v[i], 1) : price(s, s.v[i])} · 고점 대비 <span class="${c.dd[i] < -0.0005 ? 'dn' : ''}">${pct(c.dd[i])}</span>`);
}
function unhover() {
  for (const id of ['xhP', 'xhD', 'dotP', 'dotD']) { const el = document.getElementById(id); if (el) el.setAttribute('hidden', ''); }
  $('#tip').hidden = true;
}
function showTip(e, html) {
  const t = $('#tip');
  t.innerHTML = html; t.hidden = false;
  const w = t.offsetWidth, h = t.offsetHeight;
  let x = e.clientX + 14, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y < 8) y = e.clientY + 16;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function drawYears(el, s, c, W) {
  const ys = c.years.filter((y) => !y.first);
  if (!ys.length) { el.innerHTML = ''; return; }
  const Hh = 200, T = 16, B = 24, L = 58, R = 74;
  let lo = 0, hi = 0;
  for (const y of ys) { lo = Math.min(lo, y.r, y.idd); hi = Math.max(hi, y.r); }
  const ticks = niceTicks(lo, hi, 4);
  lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const Y = (x) => T + ((hi - x) / (hi - lo || 1)) * (Hh - T - B);
  const band = (W - L - R) / ys.length, bw = Math.max(2, Math.min(28, band - 2));
  const y0 = Y(0), rad = Math.min(4, bw / 2);
  const bar = (x, top, bottom, upward) => {
    const h = bottom - top; if (h < 0.5) return `M${x} ${y0}h${bw}`;
    const r = Math.min(rad, h);
    return upward
      ? `M${x} ${bottom}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + bw - r}Q${x + bw} ${top} ${x + bw} ${top + r}V${bottom}Z`
      : `M${x} ${top}V${bottom - r}Q${x} ${bottom} ${x + r} ${bottom}H${x + bw - r}Q${x + bw} ${bottom} ${x + bw} ${bottom - r}V${top}Z`;
  };
  const every = Math.max(1, Math.ceil(ys.length / Math.max(4, Math.floor((W - L - R) / 46))));
  const bars = ys.map((y, k) => {
    const x = L + k * band + (band - bw) / 2, yy = Y(y.r);
    const d = y.r >= 0 ? bar(x, yy, y0, true) : bar(x, y0, yy, false);
    return `<path d="${d}" fill="var(--${y.r >= 0 ? 'up' : 'dn'})" opacity="${y.part ? 0.45 : 1}"/>` +
      (y.idd < -0.0005 ? `<circle cx="${x + bw / 2}" cy="${Y(y.idd)}" r="${Math.min(4, Math.max(2.5, bw / 4))}" fill="var(--ink)" opacity=".7" stroke="var(--panel)" stroke-width="1.5"/>` : '') +
      ((ys.length - 1 - k) % every === 0 ? `<text x="${x + bw / 2}" y="${Hh - 6}" text-anchor="middle">${y.part ? '올해' : y.y}</text>` : '') +
      `<rect class="yhit" data-k="${k}" x="${L + k * band}" y="${T}" width="${band}" height="${Hh - T - B}" fill="transparent"/>`;
  }).join('');
  const mean = c.mean;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" height="${Hh}" role="img" aria-label="${s.name} 해마다 수익률">
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${t === 0 ? '0%' : pct(t, 0)}</text>`).join('')}
    ${bars}
    <line class="base" x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}"/>
    ${mean != null ? `<line x1="${L}" x2="${W - R}" y1="${Y(mean)}" y2="${Y(mean)}" stroke="var(--ink)" stroke-width="1.5" opacity=".55"/><text class="lbl" x="${W - R + 6}" y="${Y(mean) + 4}">평균 ${pct(mean)}</text>` : ''}
    ${c.iddMed != null ? `<line x1="${L}" x2="${W - R}" y1="${Y(c.iddMed)}" y2="${Y(c.iddMed)}" stroke="var(--accent)" stroke-width="1.5" opacity=".8"/><text class="lbl" x="${W - R + 6}" y="${Y(c.iddMed) + 4}">보통 ${pct(c.iddMed)}</text>` : ''}
  </svg>
  <p class="note">막대 = 그 해 수익률 · 점 = 그 해 안에서 고점 → 저점으로 가장 많이 빠졌던 폭(연중 최대 하락) · 주황선 = 연중 최대 하락의 가운데 값</p>`;
  el.querySelectorAll('.yhit').forEach((r) => {
    r.addEventListener('mousemove', (e) => { const y = ys[+r.dataset.k]; showTip(e, `<b>${y.y}년${y.part ? ' (진행 중)' : ''}</b><br>수익률 <span class="${ud(y.r)}">${pct(y.r)}</span><br>연중 최대 하락 <span class="dn">${pct(y.idd)}</span>`); });
    r.addEventListener('mouseleave', () => { $('#tip').hidden = true; });
  });
}

// ── 서울 아파트 표 ────────────────────────────

  ['p84', '국평(84㎡) 환산', (r) => r.sqm],

  ['ytd', '올해', (r) => r.c.ytd],
  ['y1', '1년', (r) => r.c.c1],
  ['cagr', '연평균', (r) => r.c.cagr],
  ['c10', '연평균 10년', (r) => r.c.c10],
  ['mdd', '최대 낙폭', (r) => r.c.mdd],
  ['cur', '지금 고점 대비', (r) => r.c.cur],
];

      <td class="num">${c.c10 == null ? '–' : pct(c.c10)}</td>
      <td class="num dn">${pct(c.mdd)}</td>
      <td class="num">${peakTxt(c.cur)}<span class="mini" title="역대 최대 하락 대비 지금 위치">${w >= 1 ? `<i style="width:${w.toFixed(0)}%"></i>` : ''}</span></td></tr>`;

// ── 구별 전고점 대비 ──────────────────────────
// 전고점 = 서울 전체가 가장 최근에 5% 넘게 빠졌던 하락(2022~2024)의 고점 앞뒤에서 그 구가 찍은 최고점
function peakList() {
  const rows = S.aptRows.map((r) => series(r.id));
  const seoul = rows.find((r) => r.seoul);
  const cs = calc(seoul), ep = cs.eps[cs.eps.length - 1];
  if (!ep) return null;
  const P = seoul.d[ep.p], T = seoul.d[ep.t];
  const list = rows.map((s) => {
    let pk = -1;
    // 지수가 몇 달 같은 값으로 머물 때가 있어, 고점은 같은 값 중 마지막 달·회복은 고점을 '넘은' 달로
    for (let i = 0; i < s.d.length; i++) if (s.d[i] >= P - 366 && s.d[i] <= T && (pk < 0 || s.v[i] >= s.v[pk])) pk = i;
    if (pk < 0) return null;
    let rec = -1;
    for (let i = pk + 1; i < s.d.length; i++) if (s.v[i] > s.v[pk]) { rec = i; break; }
    let lo = pk;
    for (let i = pk; i <= (rec < 0 ? s.d.length - 1 : rec); i++) if (s.v[i] < s.v[lo]) lo = i;
    return { s, pk, lo, rec, drop: s.v[lo] / s.v[pk] - 1, now: s.v[s.v.length - 1] / s.v[pk] - 1 };
  }).filter(Boolean);
  return { list, seoul, ep };
}
function renderPeaks() {
  const el = $('#peaks');
  if (!S.aptRows.length) return;
  const PL = peakList();
  if (!PL) { el.innerHTML = '<p class="note">서울 전체가 5% 넘게 빠진 적이 없어 전고점을 정하지 못했어요.</p>'; return; }
  const { list, seoul, ep } = PL;
  const top = list.filter((x) => x.s.seoul), gu = list.filter((x) => !x.s.seoul).sort((a, b) => a.now - b.now);
  const all = [...top, ...gu];
  const dmin = Math.min(-0.05, ...all.map((x) => x.drop)) * 1.08, dmax = Math.max(0.05, ...all.map((x) => x.now)) * 1.08;
  const pos = (x) => ((x - dmin) / (dmax - dmin)) * 100;
  const ticks = niceTicks(dmin, dmax, 6).filter((t) => t > dmin && t < dmax);
  const grid = ticks.filter((t) => Math.abs(t) > 1e-9).map((t) => `<i class="g" style="left:${pos(t).toFixed(2)}%"></i>`).join('');
  const below = gu.filter((x) => x.now < -0.0005), above = gu.filter((x) => x.now >= -0.0005);
  const best = gu.slice().sort((a, b) => b.now - a.now)[0];
  const sum = `서울 전체 전고점은 <b>${dstr(seoul.d[ep.p], true)}</b>, 바닥은 ${dstr(seoul.d[ep.t], true)}(${pct(ep.depth)})예요. 25개 구 중 전고점을 다시 넘은 곳 <b>${above.length}곳</b>, 아직 아래인 곳 <b>${below.length}곳</b>` +
    (below.length ? `(${below.map((x) => `${x.s.short} ${pct(x.now)}`).join(', ')})` : '') +
    (best ? ` · 가장 많이 넘은 곳 ${best.s.short} ${pct(best.now)}` : '') + '.';
  const row = (x) => {
    const s = x.s, up = x.now >= 0;
    return `<div class="pk-row${s.seoul ? ' seoul' : ''}${S.sel === s.id ? ' on' : ''}" data-id="${s.id}" title="${s.short}: 전고점 ${dstr(s.d[x.pk], true)} → 바닥 ${pct(x.drop)} → 지금 ${pct(x.now)}">
      <span>${s.short}</span>
      <div class="pk-bar">${grid}
        <i class="drop" style="left:${pos(x.drop).toFixed(2)}%;width:${(pos(0) - pos(x.drop)).toFixed(2)}%"></i>
        ${up ? `<i class="rise" style="left:${pos(0).toFixed(2)}%;width:${(pos(x.now) - pos(0)).toFixed(2)}%"></i>` : ''}
        <i class="z" style="left:${pos(0).toFixed(2)}%"></i>
        <i class="low" style="left:${pos(x.drop).toFixed(2)}%"></i>
        <i class="cur" style="left:${pos(x.now).toFixed(2)}%;background:var(--${up ? 'up' : 'dn'})"></i>
      </div>
      <span class="pk-txt"><b class="${ud(x.now)}">${pct(x.now)}</b> · 고점 ${dstr(s.d[x.pk], true)} · 바닥 ${pct(x.drop)} · ${x.rec >= 0 ? dstr(s.d[x.rec], true) + ' 회복' : '아직 회복 전'}</span>
    </div>`;
  };
  el.innerHTML = `<p class="pk-sum">${sum}</p>
    <div class="pk-axis"><span></span><div class="pk-bar">${ticks.map((t) => `<span style="left:${pos(t).toFixed(2)}%">${Math.abs(t) < 1e-9 ? '전고점' : pct(t, 0)}</span>`).join('')}</div><span>지금 전고점 대비 · 전고점 시기 · 바닥 · 회복</span></div>
    ${all.map(row).join('')}
    <p class="note">세로선 = 그 구의 전고점 · 옅은 파랑 = 전고점에서 바닥까지 빠졌던 폭 · 점 = 지금 (빨강은 전고점을 넘음, 파랑은 아직 아래) · 빨간 막대 = 전고점보다 오른 만큼 · 줄을 누르면 위에 자세히 나와요.<br>
    KB 매매가격지수는 중개업소가 매기는 시세라 실거래가보다 덜 빠지고 늦게 움직여요. 2022~2024 하락도 실거래가로는 서울이 20% 넘게 빠졌지만 이 지수로는 ${pct(ep.depth)}로 나와요.</p>`;
}

// ── 자산 온도 ─────────────────────────────────
// 자산 배분용(현금 제외): 비싼 자산을 줄이고 상대적으로 싼 자산으로 옮기기 위한 점수. 환율(달러)은 현금이라 뺀다.
// 절대 온도 = '얼마나 올랐나'(+쪽·−쪽 모두) + '얼마나 빠졌나'(−쪽만)
//   얼마나 올랐나: 최근 1년·3년·5년 수익률(연)이 역사적 연평균보다 얼마나 높은지 (그 자산의 해마다 오르내림 폭으로 나눠 자산끼리 견줄 수 있게)
//     5년도 보는 이유: 올해 많이 올랐어도 5년 수익률이 장기 평균에 못 미치면(예: SCHD·서울 아파트) 길게 보면 지나치게 오른 건 아니라서
//     부동산만 전고점도 보되, 전고점 뒤 흐른 시간 동안 장기 평균만큼 오른 몫은 빼고 센다 (4년 지나 +14%면 평균 속도보다 느린 것)
//     주식은 전고점을 계속 넘어가는 게 보통이라 금융은 수익률로만
//   얼마나 빠졌나: 고점 대비 하락이 평범한 해 하락의 몇 배인지, 역대 최대 하락(MDD)의 몇 %인지 — 빠진 만큼 '싼 쪽'으로만 센다.
//     고점 근처에 있는 것 자체는 비싸다는 뜻이 아니다 (오르는 자산은 대부분의 날을 고점 근처에서 보내고, 아파트는 평범한 해 하락이 −1%도 안 돼 거의 늘 최고가)
// 상대 순위 = 자산끼리 절대 온도 순위. 종합 = 절대 온도와 상대 순위의 평균.
const clamp1 = (x) => Math.max(-1, Math.min(1, x));
const avgOf = (xs) => { const a = xs.filter((x) => x != null && isFinite(x)); return a.length ? a.reduce((p, q) => p + q, 0) / a.length : null; };
// 지금 값(마지막)이 지난 값들 가운데 몇 %보다 높은지 (구별 비교·갈아타기에 씀)

// ── 구별 상대 가격 평가 ─────────────────────────
// 부동산 상대 평가: 강남구 대비 가격 수준이 그 구의 지난 기록 속 어디쯤인지 (평소보다 강남에 바짝 붙어 있으면 상대적으로 비쌈).
// 과거 기록에서 이 값이 평소보다 높았던 구는 그 뒤 3년 강남보다 덜 올랐다(2013~ 기록, 구 대부분 순위 상관 −0.6~−0.8). 전고점 대비는 참고로만 보여 준다.
function relRows() {
  const PL = peakList();
  if (!PL) return null;
  const L = levelRows(null);
  const gu = PL.list.filter((x) => !x.s.seoul);
  const rows = gu.map((x) => {

    const lv = L.rows.find((y) => y.r.code === code && !y.isBase);

    const p = pctRank(lv.v);
    return { x, s: x.s, lv, p, score: Math.round((2 * p - 1) * 100), order: gu.filter((y) => y.now > x.now).length + 1 };

// ── 결론: 싼 쪽·비싼 쪽 · 내 자산 리밸런싱 · 갈아타기 ──────────
// 급지는 지금 ㎡당 가격 순: 1위(강남) 기준, 상급지 2~8위 · 중급지 9~16위 · 중하급지 17~25위
function rangeStats(d, v) {
  let mn = 0, mx = 0;
  v.forEach((x, i) => { if (x < v[mn]) mn = i; if (x > v[mx]) mx = i; });
  const n = v.length, now = v[n - 1], j = idxBefore(d, d[n - 1] - 345);
  return { d, v, now, mn, mx, p: pctRank(v), d12: j >= 0 ? now - v[j] : null };
}
function tierData() {
  const L = levelRows(null);
  const gu = L.rows.filter((x) => !x.isBase && !x.r.seoul).sort((a, b) => b.r.sqm - a.r.sqm);
  const tiers = [['상급지', gu.slice(0, 7)], ['중급지', gu.slice(7, 15)], ['중하급지', gu.slice(15)]].map(([name, rows]) => {
    const m = new Map();
    for (const x of rows) x.d.forEach((d, i) => { const a = m.get(d) || [0, 0]; a[0] += x.v[i]; a[1]++; m.set(d, a); });
    const d = [...m.keys()].filter((k) => m.get(k)[1] === rows.length).sort((a, b) => a - b);
    return { name, rows, ...rangeStats(d, d.map((k) => m.get(k)[0] / m.get(k)[1])) };
  });
  return { base: L.base, tiers };
}
function pairData(fromCode, toCode) {
  const A = kbSeries(S.apt.sqm, fromCode), B = kbSeries(S.apt.sqm, toCode);
  if (!A || !B || fromCode === toCode) return null;
  const bm = new Map(B.d.map((d, i) => [d, B.v[i]])), d = [], v = [];
  A.d.forEach((x, i) => { const b = bm.get(x); if (b) { d.push(x); v.push(A.v[i] / b); } });
  return v.length < 24 ? null : { ...rangeStats(d, v), a: A.v[A.v.length - 1], b: B.v[B.v.length - 1] };
}
// 갈아타기 해석. t.now = 지금 사는 곳 ÷ 갈아탈 곳 가격, t.p = 그 비율이 지난 기록 중 몇 %보다 높은지.
// t.p가 높을수록 "지금 사는 곳이 평소보다 비싸게 팔리는 때" → 어느 방향이든 갈아타기에 유리하다.
//   올라갈 때(더 비싼 곳으로): 격차가 좁을수록 기회 · 내려갈 때(더 싼 곳으로): 격차가 넓을수록 기회
// (2013~ 기록에서 강남 대비 수준이 평소보다 높았던 구는 그 뒤 3년 강남보다 덜 올랐다)
function moveMsg(t, toName, up = true) {
  const ch = t.d12, gap = (x) => (up ? pp(Math.abs(x)).replace('+', '') : Math.abs(x).toFixed(2) + '배만큼'); // 내려갈 때는 '몇 배'로
  const trend = ch == null ? '' : Math.abs(ch) <= 0.01 ? '최근 1년 격차는 비슷해요. ' : (up ? ch > 0 : ch < 0) ? `최근 1년 격차가 ${gap(ch)} 줄었어요. ` : `최근 1년 격차가 ${gap(ch)} 벌어졌어요. `;
  if (up) {
    if (t.p >= 0.7) return `${trend}격차가 역대 좁은 쪽이라 ${toName}로 올라가는 부담이 상대적으로 작아요 → <b>지표상 갈아타기에 유리한 구간</b>`;
    if (t.p <= 0.3) return `${trend}격차가 역대 넓은 쪽이라 ${toName}로 올라가는 부담이 커요 → 올라가기보다는 <b>이쪽을 새로 사기에 상대적으로 싼 구간</b>`;
  } else {
    if (t.p >= 0.7) return `${trend}격차가 역대 넓은 쪽이라 ${toName}로 옮기면 남는 돈이 상대적으로 커요 → <b>지표상 갈아타기에 유리한 구간</b>`;
    if (t.p <= 0.3) return `${trend}격차가 역대 좁은 쪽이라 ${toName}로 옮겨도 남는 돈이 적어요 → 지표상 서두를 이유는 적은 구간`;

// 결론: 지금 싼 쪽·비싼 쪽 → 가진 자산을 고르면 규칙(상대적으로 비싼 쪽을 줄이고 싼 쪽으로, 현금 제외)대로 리밸런싱 방향 → 갈아타기

  const nowList = groups.map(([g, f], gi) => {

function kbSeries(t, code) {
  const r = t && t.rows.find((x) => x.code === code);
  if (!r) return null;
  const d = [], v = [];
  r.v.forEach((x, i) => { if (x != null) { d.push(ym(t.dates[i])); v.push(x); } });
  return { d, v };
}
function levelRows(baseCode = S.lvBase) {
  const A = S.apt, list = S.aptRows.filter((r) => r.sqm);
  const top = list.filter((r) => !r.seoul).sort((a, b) => b.sqm - a.sqm)[0];
  const base = list.find((r) => r.code === baseCode) || top;
  const b = kbSeries(A.sqm, base.code), bm = new Map(b.d.map((d, i) => [d, b.v[i]]));
  const make = (r) => {
    const s = kbSeries(A.sqm, r.code); if (!s) return null;
    const d = [], v = [];
    s.d.forEach((x, i) => { const bv = bm.get(x); if (bv) { d.push(x); v.push(s.v[i] / bv); } });
    return { d, v };
  };
  const rows = list.map((r) => {
    const raw = make(r);
    if (!raw || raw.v.length < 12) return null;
    const w = win(raw); // 최근 20년 (구별 ㎡당은 2013.04부터라 그대로)
    let mn = 0, mx = 0;
    w.v.forEach((x, i) => { if (x < w.v[mn]) mn = i; if (x > w.v[mx]) mx = i; });
    const now = w.v[w.v.length - 1];
    return { r, d: w.d, v: w.v, now, mn, mx, pos: w.v[mx] - w.v[mn] > 1e-9 ? (now - w.v[mn]) / (w.v[mx] - w.v[mn]) : null, isBase: r.code === base.code };
  }).filter(Boolean).sort((a, b) => b.r.sqm - a.r.sqm);
  return { rows, base, top };
}

    ${xTicks(D0, D1, W - L - R).map(([day, t]) => `<text x="${X(day)}" y="${Hh - 6}" text-anchor="middle">${t}</text>`).join('')}
    <line class="base" x1="${L}" x2="${W - R}" y1="${Hh - B}" y2="${Hh - B}"/>
    <path d="${path}" fill="none" stroke="var(--price)" stroke-width="2" stroke-linejoin="round"/>

    <b>시세</b> · 미국 ETF는 미국 장중(한국 밤 10:30~새벽 5:00, 서머타임 끝나면 11:30~6:00)에 움직이고 · 코스피는 네이버 증권 · 비트코인은 24시간(달러는 야후, 원화는 업비트) · ${PUBLIC ? '한 시간마다 자동으로 새로 받아요' : '화면은 15초마다 새로 받아요'}<br>
    <b>연평균 수익률</b> = 처음 값에서 지금 값까지 해마다 같은 비율로 불었다고 볼 때의 비율(복리) · <b>최대 낙폭(MDD)</b> = 그때까지의 최고가에서 가장 많이 빠졌던 비율(역대급 하락) · <b>연중 최대 하락</b> = 해마다 그 해 안에서 고점 → 저점으로 가장 많이 빠진 폭, 그 가운데 값이 '평범한 해의 하락' · <b>고점 대비</b> = 지금까지의 최고가보다 지금 얼마나 낮은지<br>
    일별 기록 ${h ? h.fetched : ''} 받음${PUBLIC ? '' : ' · 기록은 하루 한 번 새로 받아 자산모니터 폴더의 기록에 둬요'}. 자료: 야후 파이낸스·네이버 증권·업비트·KB부동산. 지난 수익률은 앞으로의 수익을 뜻하지 않아요. <b>싸다·비싸다는 지난 가격 흐름으로 본 상대적인 온도이고, 투자 권유가 아니에요. 투자 판단과 책임은 본인에게 있어요.</b>
    ${errs.length ? `<div class="err">받지 못한 기록(지난 기록으로 보여요): ${errs.join(' · ')}</div>` : ''}`;
}

// ── 불러오기 ─────────────────────────────────
const PUBLIC_DATA = { '/api/history': 'data/history.json', '/api/apt': 'data/apt.json', '/api/live': 'data/live.json' };
async function getJSON(u) {
  if (PUBLIC) u = PUBLIC_DATA[u.split('?')[0]] + '?t=' + Math.floor(Date.now() / 300000); // 공개판: 같은 폴더의 자료 파일 (5분 단위로 새로)
  const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); }
let HIST = null;
async function loadHistory(force) {
  HIST = await getJSON('/api/history' + (force ? '?force=1' : ''));
  S.assets = HIST.assets.filter((a) => a.d && a.d.length).map((a) => ({ ...a, kind: 'd' }));
  renderFoot(HIST);
}
async function loadApt(force) {
  try {
    S.apt = await getJSON('/api/apt' + (force ? '?force=1' : ''));
    S.aptRows = buildApt(S.apt);
    if (S.apt.error) $('#aptSub').textContent = 'KB 자료를 새로 받지 못해 지난 기록으로 보여요';
  } catch (e) {
    $('#aptNote').innerHTML = `<span class="err">KB부동산 자료를 받지 못했어요 (${e.message}). 잠시 뒤 [기록 다시 받기]를 눌러 주세요.</span>`;
  }
}
async function pollLive() {
  try { S.live = await getJSON('/api/live'); S.liveErr = false; }
  catch (e) { S.liveErr = true; if (!S.live) { $('#status').className = 'bad'; $('#status').innerHTML = '<span class="dot"></span>시세 서버에 닿지 않아요 · 바탕화면 아이콘을 다시 눌러 주세요'; } return; }
  renderStatus();
  if (!S.assets.length) return;
  renderCards();
  renderTemp();
  // 보고 있는 종목 값(원화 기준이면 환율도)이 바뀌었고, 차트 위에 마우스를 올려 둔 게 아니면 자세히도 다시 그린다
  const L = S.live.q[S.sel], FX = S.live.q.FX;
  const key = (L ? L.p : '') + '|' + (FX ? FX.p : '');
  if (L && key !== S.shownKey && $('#tip').hidden) { S.shownKey = key; renderDetail(); }
}
function renderBasis() { document.querySelectorAll('#basis button').forEach((b) => b.classList.toggle('on', (b.dataset.krw === '1') === S.krw)); }
function renderAll() { renderBasis(); renderCards(); renderTemp(); renderSumApt(); renderCorr(); renderDetail(); renderApt(); renderRel(); renderPeaks(); renderLevels(); renderCon(); }
function setTab(t, keepScroll) {
  S.tab = t;
  S.sel = t === 'apt' ? S.selApt : S.selFin;
  remember();
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.dataset.pane === t));
  if (t === 'fin') $('#hostFin').appendChild($('#detail'));
  if (t === 'apt') $('#hostApt').appendChild($('#detail'));
  renderAll();
  if (!keepScroll) scrollTo(0, 0);
}

document.addEventListener('click', (e) => {
  const md = e.target.closest('[data-mvdir]');
  if (md) { S.mvDir = md.dataset.mvdir; remember(); renderCon(); return; }
  const tb = e.target.closest('#tabs button, [data-goto]');
  if (tb) { setTab(tb.dataset.tab || tb.dataset.goto); return; }
  const card = e.target.closest('.card');
  if (card) {
    pick(card.dataset.id);
    if (S.tab === 'fin' && !card.dataset.id.startsWith('APT')) { remember(); renderAll(); return; }
    setTab(card.dataset.id.startsWith('APT') ? 'apt' : 'fin');
    return;
  }
  const bs = e.target.closest('#basis button');
  if (bs) { S.krw = bs.dataset.krw === '1'; remember(); renderAll(); return; }
  const cc = e.target.closest('[data-corr]');
  if (cc) { S.corrSel = cc.dataset.corr; renderCorr(); return; }
  const lr = e.target.closest('.lv-row');
  if (lr) { S.lvSel = lr.dataset.lv; remember(); renderLevels(); return; }
  const pr = e.target.closest('.pk-row[data-id]');
  if (pr) { pick(pr.dataset.id); remember(); renderAll(); $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const chip = e.target.closest('[data-period]');
  if (chip) { S.period = chip.dataset.period; remember(); renderDetail(); return; }
  const th = e.target.closest('#aptTable th');
  if (th) { const k = th.dataset.k; S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: k === 'short' || k === 'mdd' || k === 'cur' ? 1 : -1 }; remember(); renderApt(); return; }
  const tr = e.target.closest('#aptTable tbody tr, #tempTable tbody tr, #relTable tbody tr');
  if (tr) {
    pick(tr.dataset.id);
    const want = tr.dataset.id.startsWith('APT') ? 'apt' : 'fin';
    if (S.tab !== want) { setTab(want); return; }
    remember(); renderAll(); $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'logBox') { S.log = e.target.checked; remember(); renderDetail(); }
  if (e.target.id === 'lvBase') { S.lvBase = e.target.value; remember(); renderLevels(); }
  if (e.target.id === 'mvFrom' || e.target.id === 'mvTo') { S[e.target.id] = e.target.value; remember(); renderCon(); }
  if (e.target.dataset && e.target.dataset.hold) { const id = e.target.dataset.hold; S.hold = e.target.checked ? [...new Set([...S.hold, id])] : S.hold.filter((x) => x !== id); remember(); renderCon(); }
});
if (PUBLIC) $('#reload').hidden = true;
$('#reload').addEventListener('click', async () => {
  const b = $('#reload'); b.disabled = true; b.textContent = '받는 중…';
  try { await Promise.all([loadHistory(true), loadApt(true)]); renderAll(); } catch (e) { alert('다시 받지 못했어요: ' + e.message); }
  b.disabled = false; b.textContent = '기록 다시 받기';
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderDetail, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollLive(); });

(async () => {
  pollLive();
  try { await loadHistory(); } catch (e) { $('#cards').innerHTML = `<div class="loading err">시세 기록을 받지 못했어요 (${e.message}). 인터넷 연결을 확인하고 [기록 다시 받기]를 눌러 주세요.</div>`; }
  await loadApt();
  if (!series(S.selFin)) S.selFin = 'VOO';
  if (!series(S.selApt)) S.selApt = 'APT1100000000';
  setTab(S.tab, true);
  setInterval(pollLive, PUBLIC ? 300000 : 15000);
})();
</script>
</body>
</html>
